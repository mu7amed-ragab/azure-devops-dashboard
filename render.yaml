# Demo deployment: serves the fictional organization, no Azure DevOps account needed.
# For a real deployment use deploy/render.real.yaml instead (see README).
services:
  - type: web
    name: azure-devops-dashboard-demo
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_MODE
        value: '1'
